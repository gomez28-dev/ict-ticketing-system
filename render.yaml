databases:
  - name: ict-helpdesk-db
    plan: free
    databaseName: ict_helpdesk
    user: ict_helpdesk

services:
  - type: web
    name: ict-helpdesk
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ict-helpdesk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_ROLE
        value: ADMIN
      - key: BOOTSTRAP_IMPORT_SCHOOLS
        value: "True"
      - key: BOOTSTRAP_SCHOOLS_FILE
        value: schools.xlsx
