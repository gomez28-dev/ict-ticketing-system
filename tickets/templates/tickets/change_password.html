{% extends 'tickets/base_admin.html' %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="{% url 'dashboard' %}" class="text-sm text-blue-600 dark:text-blue-400 hover:underline mb-2 inline-block">&larr; Back to Dashboard</a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Change Password</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Update your account password for security.</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-8 transition-colors">

        {% if messages %}
        {% for message in messages %}
        <div class="mb-6 px-4 py-3 rounded-lg text-sm font-medium
            {% if message.tags == 'success' %}bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 text-green-600 dark:text-green-400
            {% elif message.tags == 'error' %}bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400
            {% else %}bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 text-blue-600 dark:text-blue-400{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-2 font-bold">Current Password</label>
                <input type="password" name="old_password" required autocomplete="current-password"
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-[#0078d4] outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-2 font-bold">New Password</label>
                <input type="password" name="new_password1" required autocomplete="new-password"
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-[#0078d4] outline-none">
            </div>

            <div>
                <label class="block text-xs text-gray-500 dark:text-gray-400 mb-2 font-bold">Confirm New Password</label>
                <input type="password" name="new_password2" required autocomplete="new-password"
                    class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-[#0078d4] outline-none">
            </div>

            <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex flex-col sm:flex-row justify-end gap-3">
                <a href="{% url 'dashboard' %}" class="min-h-11 inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors">Cancel</a>
                <button type="submit" class="min-h-11 inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-sm transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
