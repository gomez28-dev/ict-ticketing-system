<a href="{% url url_pattern %}" class="flex items-center justify-between px-4 py-3 text-sm rounded-lg transition-all {% if request.resolver_match.url_name in active_urls %}bg-gray-800 text-white border-l-4 border-blue-500 shadow-lg{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
    <div class="flex items-center gap-3">
        {{ label }}
    </div>
    {% if badge_count and badge_count > 0 %}
        <span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm">{{ badge_count }}</span>
    {% endif %}
</a>
