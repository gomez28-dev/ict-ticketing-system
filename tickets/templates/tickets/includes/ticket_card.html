<div class="ticket-card bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 cursor-pointer hover:shadow-md hover:border-blue-300 dark:hover:border-blue-500 transition-all"
     data-id="{{ ticket.id }}"
     data-number="{{ ticket.ticket_number|default:'TKT-NEW' }}"
     data-title="{{ ticket.title }}"
     data-description="{{ ticket.description }}"
     data-requester="{{ ticket.first_name }} {{ ticket.last_name }}"
     data-contact="{{ ticket.contact_number|default:'No Number' }}"
     data-email="{{ ticket.email|default:'No Email' }}"
     data-school="{{ ticket.school_name|default:'Not Specified' }}"
     data-district="{{ ticket.get_school_district_display|default:'Not Specified' }}"
     data-support-type="{{ ticket.get_support_type_display|default:'General' }}"
     data-notes="{{ ticket.admin_notes|default:'' }}"
     data-created="{{ ticket.created_at|date:'n/j/Y, g:i A' }}"
     data-updated="{{ ticket.updated_at|date:'n/j/Y, g:i A' }}"
     data-status="{{ ticket.status }}"
     data-priority="{{ ticket.priority }}"
     data-predicted="{{ ticket.predicted_hours|default:'1' }}">

    <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-medium text-gray-500 dark:text-gray-400">{{ ticket.ticket_number|default:"TKT-NEW" }}</span>
        <span class="w-2 h-2 rounded-full {% if ticket.priority == 'HIGH' or ticket.priority == 'URGENT' %}bg-red-500{% elif ticket.priority == 'MEDIUM' %}bg-yellow-500{% else %}bg-green-500{% endif %}"></span>
    </div>

    <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100 mb-1 leading-tight">{{ ticket.title|default:"Untitled Task" }}</h4>
    <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 truncate">{{ ticket.get_support_type_display|default:ticket.description }}</p>

    <div class="flex items-center justify-between mt-auto">
        <div class="flex gap-2 items-center">
            <span class="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-[10px] font-semibold rounded uppercase tracking-wider">{{ ticket.priority }}</span>

            <span class="px-2 py-1 bg-purple-50 dark:bg-purple-900/30 text-purple-700 dark:text-purple-400 text-[10px] font-bold rounded flex items-center gap-1 border border-purple-100 dark:border-purple-800" title="AI Predicted Resolution Time">
                🤖 {{ ticket.predicted_hours|default:'1' }}h
            </span>

        </div>

        <div class="w-6 h-6 rounded-full bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 flex items-center justify-center text-[10px] font-bold" title="{{ ticket.school_district }}">
            {{ ticket.school_district|make_list|last|default:"--" }}
        </div>
    </div>
</div>
