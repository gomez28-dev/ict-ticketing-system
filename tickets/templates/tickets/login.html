{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ICT Unit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom subtle background pattern */
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-gray-200">
    <div class="flex-grow flex items-center justify-center">
        <div class="bg-[#1e293b]/60 backdrop-blur-xl border border-white/10 p-10 rounded-2xl shadow-2xl w-full max-w-sm mx-4">

            <div class="flex flex-col items-center mb-8">
                <img src="{% static 'tickets/images/ICT_Logo.png' %}" alt="ICT Helpdesk Logo" class="h-24 w-auto mx-auto object-contain mb-6">
                <h1 class="text-2xl font-bold tracking-wide text-white">ICT UNIT</h1>
                <p class="text-xs text-gray-400 font-medium">Work Management</p>
            </div>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/50 text-red-400 text-xs px-4 py-2 rounded-lg mb-6 text-center">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5 ml-1">Email</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </span>
                        <input type="text" name="email" required placeholder="Enter your email" class="w-full bg-[#0f172a]/50 border border-gray-600 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder-gray-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input id="password" type="password" name="password" required placeholder="Enter your password" class="w-full bg-[#0f172a]/50 border border-gray-600 rounded-lg py-2.5 pl-10 pr-10 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder-gray-500">
                        <button type="button" id="togglePassword" class="absolute right-3 top-2.5 text-gray-500 cursor-pointer hover:text-gray-300" aria-label="Show password">
                            <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] transition-all mt-2">
                    Login
                </button>
            </form>

            <div class="flex justify-center items-center mt-6 text-xs text-blue-400">
                <a href="#" class="hover:text-blue-300 hover:underline transition-colors">Forgot password?</a>
            </div>

        </div>
    </div>

    <footer class="w-full bg-[#1e293b]/80 border-t border-white/10 text-gray-400 py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-xs">
            <div class="mb-4 md:mb-0 flex items-center gap-4">
                <img src="{% static 'tickets/images/ICT_Logo.png' %}" alt="ICT Helpdesk Logo" class="h-10 w-auto object-contain">
                <div>
                    <p class="font-medium text-gray-300">DepEd Division of Valenzuela - ICT Unit</p>
                    <p>&copy; {% now "Y" %} All rights reserved.</p>
                </div>
            </div>
            <div class="flex space-x-6">
                <a href="#" class="hover:text-gray-200 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-gray-200 transition-colors">Terms of Service</a>
                <a href="#" class="hover:text-gray-200 transition-colors">Contact Support</a>
            </div>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('togglePassword');

            if (passwordInput && toggleButton) {
                toggleButton.addEventListener('click', function() {
                    const reveal = passwordInput.type === 'password';
                    passwordInput.type = reveal ? 'text' : 'password';
                    toggleButton.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
                });
            }
        });
    </script>
</body>
</html>
