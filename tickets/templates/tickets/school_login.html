<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Login - Helpdesk Submission</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background-color: #004494; }
        .alert { padding: 10px; background-color: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 style="text-align: center; margin-bottom: 20px;">School Helpdesk Portal</h2>

        {% if messages %}
            <div class="alert">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'school_login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="school_name">Select School:</label>
                <select name="school_name" id="school_name" class="form-control" required>
                    <option value="" disabled selected>-- Choose your school --</option>
                    {% for school in schools %}
                        <option value="{{ school.name }}">{{ school.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="school_id">School ID (Password):</label>
                <input type="password" name="school_id" id="school_id" class="form-control" placeholder="Enter your official School ID" required>
            </div>

            <button type="submit" class="btn-submit">Access Submission Form</button>
        </form>
    </div>
</body>
</html>
