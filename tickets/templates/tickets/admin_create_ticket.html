{% extends 'tickets/base_admin.html' %}

{% block title %}Create Ticket - Helpdesk{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Create New Ticket</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">Manually generate a task and assign it to the board.</p>
        </div>
        <a href="{% url 'dashboard' %}" class="text-sm font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 transition-colors">
            &larr; Back to Dashboard
        </a>
    </div>

    <form method="POST" class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
        {% csrf_token %}
        <div class="p-8 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">First Name</label>
                    <input type="text" name="first_name" required class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
                    <input type="text" name="last_name" required class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">School Name</label>
                    <input type="text" name="school_name" required class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Support Type</label>
                    <select name="support_type" required class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                        <option value="CCTV">CCTV Maintenance/Repair</option>
                        <option value="PC_MAINTENANCE">Computer Maintenance/Repair</option>
                        <option value="NETWORK_MAINTENANCE">Network Maintenance</option>
                        <option value="GOOGLE_ACCOUNT">Google Account Creation</option>
                        <option value="MS_ACCOUNT">Microsoft Account Creation</option>
                        <option value="PASSWORD_RESET">Password Reset</option>
                        <option value="OTHER">Other Support</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Issue Description</label>
                <textarea name="description" rows="4" required class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200"></textarea>
            </div>

            <hr class="border-gray-200 dark:border-gray-700">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Work Type</label>
                    <select name="work_type" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                        <option value="REMOTE WORK" selected>Remote Work</option>
                        <option value="FIELD WORK">Field Work</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Set Priority</label>
                    <select name="priority" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                    <input type="hidden" name="predicted_hours" value="1">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Date</label>
                        <input type="date" name="scheduled_date" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Time</label>
                        <input type="time" name="scheduled_time" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Assign to Employee</label>
                <input type="text" id="manualStaffSearch" onkeydown="if(event.key === 'Enter') { event.preventDefault(); return false; }" placeholder="Search by name..." class="w-full mb-2 border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 text-sm bg-white dark:bg-gray-700 text-gray-900 dark:text-white outline-none focus:ring-2 focus:ring-blue-500">

                <div class="max-h-48 overflow-y-auto border border-gray-300 dark:border-gray-600 rounded-lg p-2 bg-gray-50 dark:bg-gray-800/50 space-y-1 custom-scrollbar">
                    {% for staff in staff_data %}
                    <label class="manual-staff-item flex items-center gap-3 cursor-pointer p-2 hover:bg-gray-200 dark:hover:bg-gray-600 rounded transition-colors">
                        <input type="checkbox" name="assigned_staff" value="{{ staff.name }}" class="w-4 h-4 text-blue-600 bg-white border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600">
                        <span class="manual-staff-name text-sm font-medium text-gray-800 dark:text-gray-200">{{ staff.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

        </div>

        <div class="px-8 py-4 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-200 dark:border-gray-700 flex justify-end">
            <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition-colors">
                Create & Send to Employee
            </button>
        </div>
    </form>
</div>

<style>
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
.dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('manualStaffSearch');
        const staffItems = document.querySelectorAll('.manual-staff-item');

        if(searchInput) {
            searchInput.addEventListener('input', function(e) {
                const term = e.target.value.toLowerCase();
                staffItems.forEach(item => {
                    const name = item.querySelector('.manual-staff-name').textContent.toLowerCase();
                    if (name.includes(term)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
    });
</script>
{% endblock %}
